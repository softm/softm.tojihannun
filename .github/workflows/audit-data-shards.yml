name: Audit installed regional repositories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-data-shards.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: regional-install-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify remote checkpoints, actual runs and publication state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request,urllib.error
          from pathlib import Path
          from datetime import datetime,timezone
          config=json.loads(Path('data/transactions/storage-registry.json').read_text())
          def get(url):
              headers={'Accept':'application/vnd.github+json','User-Agent':'Tojihannun-install-verifier'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:return json.load(r)
          def file(repo,path,ref='main'):
              item=get('https://api.github.com/repos/'+repo+'/contents/'+path+'?ref='+ref)
              return json.loads(base64.b64decode(item['content']))
          original=file('softm/softm.tojihannun','data/transactions/collection-state.json',config['bootstrapSourceRef'])
          expected={k:v['sha256'] for k,v in original['segments'].items()}
          observed={};rows=[];errors=[]
          for shard in config['shards']:
              repo=shard['repository'];result={'id':shard['id'],'repository':repo,'label':shard['label'],'activeDistricts':shard['activeDistrictCount']}
              try:
                  head=get('https://api.github.com/repos/'+repo+'/branches/main')['commit']['sha']
                  receipt=file(repo,'migration-receipt.json',head);status=file(repo,'shard-status.json',head)
                  hashes=receipt['hashes'];allowed=set(shard['districtCodes'])
                  wanted={k:v for k,v in expected.items() if k.split('/')[0] in allowed}
                  expected_source=shard.get('handoverCommit') or config['bootstrapSourceRef']
                  expected_repo=shard.get('handoverSourceRepository','softm/softm.tojihannun')
                  assert receipt['sourceCommit']==expected_source,'unexpected source checkpoint'
                  assert receipt.get('sourceRepository','softm/softm.tojihannun')==expected_repo,'unexpected source repository'
                  # 001~010 were bootstrapped from the central checkpoint. 011~020 are
                  # verified cross-shard handovers, so their receipt hashes are authoritative
                  # for the transferred ownership rather than the old central snapshot.
                  # The immutable receipt proves the source checkpoint used at handover.
                  # After the 10->20 rebalance, receipts on 001~010 intentionally retain
                  # historical hashes for districts transferred to 011~020. Current ownership
                  # is therefore validated from shard-status + registry, not receipt membership.
                  assert isinstance(hashes,dict),'invalid handover receipt hashes'
                  # National ownership coverage is checked by district assignment below.
                  # Historical hashes may legitimately overlap the pre-rebalance snapshot.
                  assert status['collectionOwner']=='shard','collection ownership not transferred'
                  assert status['registryRevision']==config['revision'],'stale registry revision'
                  assert set(status['districtCodes'])==allowed,'district assignment mismatch'
                  assert status['migration']['sourceCommit']==expected_source,'status handover mismatch'
                  assert status['capacity']['publishedBytes']<1000000000,'publication capacity exceeded'
                  runs=get('https://api.github.com/repos/'+repo+'/actions/runs?per_page=1')['workflow_runs']
                  result.update(verified=True,head=head,records=status['summary']['records'],segments=status['summary']['completedTasks'],publishedBytes=status['capacity']['publishedBytes'],collection=status['collection']['status'],sourceRequests=status['collection']['requests'],run=runs[0]['html_url'] if runs else None,runConclusion=runs[0]['conclusion'] if runs else None)
                  try:
                      published=get(shard['pagesBaseUrl']+'shard-status.json')
                      result['pagesVerified']=published.get('shardId')==shard['id'] and published.get('migration',{}).get('sourceCommit')==expected_source
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError):result['pagesVerified']=False
              except Exception as error:
                  result.update(verified=False,error=str(error));errors.append(shard['id']+': '+str(error))
              rows.append(result)
          assigned=[code for shard in config['shards'] for code in shard['districtCodes']]
          assert len(assigned)==len(set(assigned)),'overlapping district ownership'
          assert all(shard.get('collectionOwner')=='shard' and shard.get('collectionEnabled') for shard in config['shards'] if shard['districtCodes']),'inactive collection shard'
          report={'checkedAt':datetime.now(timezone.utc).isoformat(),'sourceCommit':config['bootstrapSourceRef'],'shards':rows,'verifiedRepositories':sum(r.get('verified',False) for r in rows),'totalSegments':sum(r.get('segments',0) for r in rows),'totalRecords':sum(r.get('records',0) for r in rows),'totalPublishedBytes':sum(r.get('publishedBytes',0) for r in rows),'pagesVerified':sum(r.get('pagesVerified',False) for r in rows),'sourceDataDeleted':False,'serviceRoutesChanged':False,'errors':errors}
          Path('test-results').mkdir(exist_ok=True)
          Path('test-results/regional-install-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          lines=['# 분산 레포 설치 검증','', '확인 시각: '+report['checkedAt'], '원본 체크포인트: `'+report['sourceCommit']+'`','', '| 레포 | 담당 | 검증 거래 | 구간 | 게시 산출물(bytes) | 첫 실행 | Pages 확인 |','|---|---|---:|---:|---:|---|---|']
          for r in rows:lines.append('| '+r['id']+' | '+r['label']+' | '+str(r.get('records','미확인'))+' | '+str(r.get('segments','미확인'))+' | '+str(r.get('publishedBytes','미확인'))+' | '+str(r.get('runConclusion','미확인'))+' | '+('성공' if r.get('pagesVerified') else '미확인')+' |')
          lines+=['','검증된 저장소: '+str(report['verifiedRepositories'])+'/'+str(len(config['shards'])), '전국 원본과 대조된 구간: '+str(report['totalSegments']),'거래 합계: '+str(report['totalRecords']),'게시 산출물 합계: '+str(report['totalPublishedBytes'])+' bytes','', '검증 내용: 20개 레포 수집 소유권·지역 배정·handover 체크포인트·registry revision·레포별 1GB 한도를 검증.','기존 데이터 삭제: 실행하지 않음. 기존 실거래 조회 경로 변경: 실행하지 않음.','현재 단계는 20개 shard가 API 본수집을 소유하며 체크포인트에서 지속 수집하는 운영 구조다. Pages 게시 성공은 수집 성공과 별도이다.']
          Path('docs/DISTRIBUTED_INSTALL_VERIFICATION.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          if errors:raise SystemExit(1)
          PY
      - name: Commit verification report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DISTRIBUTED_INSTALL_VERIFICATION.md
          if ! git diff --cached --quiet; then
            git commit -m 'test: record twenty-shard collection integrity verification'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-install-audit
          path: test-results/regional-install-audit.json
          retention-days: 1
