name: Verify single trade presentation
on:
  push:
    branches: [fix/single-trade-presentation-20261117]
    paths:
      - .github/workflows/verify-single-trade-presentation.yml
      - scripts/install-single-trade-presentation.mjs
      - scripts/single-trade-presentation.test.mjs
      - scripts/single-trade-presentation.browser.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: single-trade-presentation-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref_name == 'fix/single-trade-presentation-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply guarded single-contract presentation
        run: |
          set -euo pipefail
          node --check scripts/install-single-trade-presentation.mjs
          node scripts/install-single-trade-presentation.mjs
          node scripts/install-single-trade-presentation.mjs
          node --check transaction-price-context.js
          node --check transaction-ui.js
      - name: Regression tests and production build
        run: |
          set -euo pipefail
          npm ci
          npm test
          python3 -m unittest discover -s scripts/rtms -p 'test_*.py'
          npm run build
      - name: Existing UI regressions and single-contract screenshots
        run: |
          set -euo pipefail
          npm install --prefix /tmp/single-trade-browser playwright@1.56.1
          /tmp/single-trade-browser/node_modules/.bin/playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE=/tmp/single-trade-browser/node_modules/playwright/index.mjs
          node scripts/transaction-ui.browser.mjs
          node scripts/transaction-price-context.browser.mjs
          node scripts/full-collected-history.browser.mjs
          node scripts/single-trade-presentation.browser.mjs
      - name: Commit verified presentation on review branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transaction-price-context.js transaction-ui.js transaction-ui.css index.html scripts/transaction-ui-layout.mjs scripts/install-transaction-ui.mjs scripts/install-unified-price-context.mjs scripts/install-full-collected-history.mjs scripts/install-default-36-months.mjs scripts/transaction-ui.browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: show one contract once without empty chart or duplicate statistics'
            git push origin HEAD:${{ github.ref_name }}
          fi
          git rev-parse HEAD > test-results/single-trade/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-trade-proof
          path: test-results/single-trade/
          retention-days: 1
          if-no-files-found: ignore
