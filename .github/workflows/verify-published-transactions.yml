name: Verify published transaction data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-published-transactions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare published assets and bounded samples to committed data
        run: |
          mkdir -p test-results/publication
          python3 - <<'PY'
          import json,hashlib,urllib.request,time,gzip,os
          from pathlib import Path
          base='https://tojihannun.designboard.net/'
          report={'base':base,'commit':os.environ['GITHUB_SHA'],'checked':[],'scope':'all application assets and region indexes; at most three transaction shards per district'}
          def check(relative):
              local=Path(relative).read_bytes()
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(base+relative+'?proof='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as r:raw=r.read();status=r.status
                      assert raw==local, 'Published bytes differ: '+relative
                      report['checked'].append({'file':relative,'http':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                      return raw
                  except Exception:
                      if attempt==7:raise
                      time.sleep(5)
          for p in ['index.html','data-status.html','data-status.js','data-status.css','static-transactions.js','market-data.js']:
              check(p)
          manifest=json.loads(check('data/transactions/status-manifest.json'))
          assert manifest['summary']['records']==sum(r['records'] or 0 for r in manifest['regions'])
          index=json.loads(check('data/transactions/published/index.json'))
          assert index['fullCountryComplete'] is False
          example=None;sample_count=0
          for district,meta in index['districts'].items():
              region=json.loads(check('data/transactions/published/'+meta['index']))
              count=0
              for stream,groups in region['groups'].items():
                  for emd,parts in groups.items():
                      for part in parts:
                          if count>=3:continue
                          raw=check('data/transactions/published/'+part['path']);data=json.loads(raw)
                          zipped=check('data/transactions/published/'+part['gzip'])
                          assert gzip.decompress(zipped)==raw
                          assert len(data['rows'])==part['rows'] and hashlib.sha256(raw).hexdigest()==part['sha256']
                          assert data['district']==district and data['stream']==stream and data['emd']==emd
                          count+=1;sample_count+=1
                          if not example and stream.endswith('-sale'):
                              row=next((r for r in data['rows'] if r['exactLotPublic'] and not r['cancelled']),None)
                              if row:example={'lawdCode':district,'emd':emd,'lot':row['lot'],'type':row['type']}
          report['summary']=manifest['summary'];report['sampledShards']=sample_count;report['lastRun']=manifest['collection']['history'][0]
          report['verifiedAt']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          Path('test-results/publication/proof.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          Path('test-results/publication/example.json').write_text(json.dumps(example,ensure_ascii=False))
          print(json.dumps({'summary':report['summary'],'sampledShards':sample_count,'checkedFiles':len(report['checked']),'lastRun':report['lastRun']},ensure_ascii=False))
          PY
      - name: Inspect real published dashboard and static lookup in a browser
        run: |
          npm install --prefix /tmp/rtms-live playwright@1.56.1
          /tmp/rtms-live/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/rtms-live/node_modules/playwright/index.mjs';
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch();const results=[];const base='https://tojihannun.designboard.net/';
          try {
            for(const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]) {
              const page=await browser.newPage({viewport:{width,height}});const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto(base+'data-status.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelectorAll('#regions .province').length>0);
              await page.locator('#search').fill('광명');
              await page.getByRole('button').filter({hasText:'광명시'}).click();
              await page.waitForFunction(()=>document.querySelectorAll('#detail table').length>0);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
              await page.screenshot({path:'test-results/publication/data-status-'+name+'.png',fullPage:true});
              results.push({viewport:name,pageErrors:errors,summary:await page.locator('#summary').innerText()});assert.deepEqual(errors,[]);
              await page.close();
            }
            const example=JSON.parse(await fs.readFile('test-results/publication/example.json','utf8'));
            assert.ok(example,'Expected a real exact-lot record in published data');
            const page=await browser.newPage();let governmentRequests=0;page.on('request',r=>{if(r.url().includes('apis.data.go.kr'))governmentRequests++;});
            await page.goto(base+'data-status.html');await page.addScriptTag({url:base+'static-transactions.js'});
            const data=await page.evaluate(s=>window.TojiStaticTrades.lookup(s,s.type),example);
            assert.ok(data.rows.length);assert.ok(data.rows.every(r=>r.jibun===example.lot));assert.equal(governmentRequests,0);
            results.push({staticLookup:example,records:data.rows.length,governmentRequests});
            await fs.writeFile('test-results/publication/browser.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results));
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-transactions-proof
          path: test-results/publication/
          retention-days: 7
