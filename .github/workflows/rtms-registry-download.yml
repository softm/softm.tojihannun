name: Acquire official RTMS region codes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rtms-registry-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codes:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Download official all-code file once
        run: |
          mkdir -p registry-data
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib
          from pathlib import Path
          url='https://www.code.go.kr/etc/codeFullDown.do'
          req=urllib.request.Request(url,data=urllib.parse.urlencode({'codeseId':'법정동코드'}).encode(),headers={'Referer':'https://www.code.go.kr/stdcode/regCodeL.do','User-Agent':'Tojihannun-collector/2.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              data=r.read(30000001);content_type=r.headers.get('Content-Type','')
          assert len(data)<=30000000
          Path('registry-data/official-registry.bin').write_bytes(data)
          report={'source':url,'bytes':len(data),'contentType':content_type,'sha256':hashlib.sha256(data).hexdigest()}
          Path('registry-data/report.json').write_text(json.dumps(report));print(report)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-rtms-registry
          path: registry-data/
          retention-days: 7
