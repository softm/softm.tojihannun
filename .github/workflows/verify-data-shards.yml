name: Verify distributed data structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-data-shards.yml'
      - 'scripts/distribution/**'
      - 'data/transactions/storage-registry.json'
      - 'static-transactions.js'
      - 'distributed-transactions.js'
      - 'distributed-status.js'
      - 'data-status.js'
      - 'data-status.html'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distributed-data-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate checked-in distributed integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry=json.loads(Path('data/transactions/storage-registry.json').read_text())
          assert registry.get('schemaVersion') == 3, 'storage registry schema mismatch'
          shards=registry.get('shards') or []
          assert len(shards) == 20, 'exactly 20 shard repositories must be registered'
          ids=[s.get('id') for s in shards]
          assert len(ids) == len(set(ids)), 'duplicate shard id'
          assert all(s.get('repository') == 'softm/' + s.get('id','') for s in shards), 'repository identity mismatch'
          assert all(s.get('collectionOwner') == 'shard' for s in shards if s.get('districtCodes')), 'assigned shard ownership mismatch'

          status_js=Path('data-status.js').read_text()
          status_html=Path('data-status.html').read_text()
          build_js=Path('scripts/build-pages.mjs').read_text()
          assert 'TojiDistributedStatus' in status_js and 'reports={}' in status_js and 'window.TojiDistributedStatus.load(config)' in status_js, 'distributed dashboard integration missing'
          assert './distributed-status.js' in status_html, 'distributed status script missing from page'
          assert '"distributed-status.js"' in build_js, 'distributed status asset missing from Pages build'
          print('Checked-in twenty-shard integration is structurally valid.')
          PY
      - name: Regression tests and production build
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm ci
          npm test | tee test-results/node-tests.txt
          python3 -m unittest discover -s scripts/rtms -p 'test_*.py' | tee test-results/rtms-tests.txt
          python3 -m unittest discover -s scripts/distribution -p 'test_*.py' | tee test-results/distribution-tests.txt
          npm run build | tee test-results/build.txt
      - name: Preserve exact tracked source for reproducible verification
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git archive --format=tar.gz HEAD > test-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-data-verification
          path: test-results/
          retention-days: 1
