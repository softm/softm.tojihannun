name: Verify distributed data structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-data-shards.yml'
      - 'scripts/distribution/**'
      - 'data/transactions/storage-registry.json'
      - 'distributed-transactions.js'
      - 'distributed-status.js'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: distributed-data-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed distributed integration
        run: |
          if test -f scripts/distribution/integrate.py; then python3 scripts/distribution/integrate.py; fi
          python3 scripts/distribution/expand_pool.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('data-status.html')
          p.write_text(p.read_text().replace('distributed-status.js?v=20261110.5','distributed-status.js?v=20261110.pool20'))
          PY
      - name: Regression tests and production build
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm ci
          npm test | tee test-results/node-tests.txt
          python3 -m unittest discover -s scripts/rtms -p 'test_*.py'
          python3 -m unittest discover -s scripts/distribution -p 'test_*.py'
          npm run build
      - name: Commit verified integration without touching transaction data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/transactions/storage-registry.json scripts/rtms/collector.py data-status.js data-status.html scripts/build-pages.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat: register twenty data repositories without changing region ownership'
            git push origin HEAD:main
          fi
      - name: Deploy verified dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Preserve exact tracked source for reproducible verification
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git archive --format=tar.gz HEAD > test-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-data-verification
          path: test-results/
          retention-days: 3
