name: Verify 36-month transaction default
on:
  push:
    branches: [fix/default-36-months-20261117]
    paths:
      - .github/workflows/verify-default-36-months.yml
      - scripts/install-default-36-months.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: default-36-months-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref_name == 'fix/default-36-months-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply default change on review branch only
        run: |
          set -euo pipefail
          node --check scripts/install-default-36-months.mjs
          node scripts/install-default-36-months.mjs
          node scripts/install-default-36-months.mjs
          node --check market-data.js
          node --check scripts/full-collected-history.browser.mjs
      - name: Verify unit tests and production build
        run: |
          set -euo pipefail
          npm ci
          npm test
          python3 -m unittest discover -s scripts/rtms -p 'test_*.py'
          npm run build
      - name: Verify range, price basis and pagination in the browser
        run: |
          set -euo pipefail
          npm install --prefix /tmp/range-browser playwright@1.56.1
          /tmp/range-browser/node_modules/.bin/playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE=/tmp/range-browser/node_modules/playwright/index.mjs
          node scripts/transaction-ui.browser.mjs
          node scripts/transaction-price-context.browser.mjs
          node scripts/full-collected-history.browser.mjs
      - name: Commit verified source to review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html market-data.js scripts/full-history-default.test.mjs scripts/mobile-detail-market-config.test.mjs scripts/rtms-behavior.test.mjs scripts/full-collected-history.browser.mjs scripts/transaction-ui-layout.mjs scripts/install-transaction-ui.mjs scripts/install-unified-price-context.mjs scripts/install-full-collected-history.mjs
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'fix: apply verified 36-month initial and new-parcel transaction range'
            git push origin HEAD:${{ github.ref_name }}
          fi
          git rev-parse HEAD
