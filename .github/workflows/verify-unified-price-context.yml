name: Verify unified transaction price context
on:
  push:
    branches: [feat/unified-trade-price-context-20261117]
    paths:
      - .github/workflows/verify-unified-price-context.yml
      - transaction-price-context.js
      - scripts/install-unified-price-context.mjs
      - scripts/transaction-price-context.test.mjs
      - scripts/transaction-price-context.browser.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unified-price-context-review
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref_name == 'feat/unified-trade-price-context-20261117'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed integration on feature branch only
        run: |
          set -euo pipefail
          node --check transaction-price-context.js
          node --check scripts/install-unified-price-context.mjs
          node scripts/install-unified-price-context.mjs
          node --check transaction-ui.js
          node --check scripts/transaction-ui.browser.mjs
      - name: Complete unit tests and production build
        run: |
          set -euo pipefail
          mkdir -p test-results
          npm ci
          npm test | tee test-results/price-unit.txt
          python3 -m unittest discover -s scripts/rtms -p 'test_*.py'
          npm run build
          test -s dist/transaction-price-context.js
      - name: Verify old paging and new price comprehension in real browser
        run: |
          set -euo pipefail
          npm install --prefix /tmp/price-context-browser playwright@1.56.1
          /tmp/price-context-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/price-context-browser/node_modules/playwright/index.mjs node scripts/transaction-ui.browser.mjs
          PLAYWRIGHT_MODULE=/tmp/price-context-browser/node_modules/playwright/index.mjs node scripts/transaction-price-context.browser.mjs
      - name: Commit tested integration to the same feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transaction-ui.js transaction-ui.css index.html scripts/build-pages.mjs scripts/transaction-ui-layout.mjs scripts/install-transaction-ui.mjs scripts/transaction-ui.test.mjs scripts/transaction-ui.browser.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat: apply tested same-area same-price transaction presentation'
            git push origin HEAD:${{ github.ref_name }}
          fi
          git rev-parse HEAD > test-results/price-context-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-price-context-proof
          path: test-results/
          retention-days: 1
