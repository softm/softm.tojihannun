name: Verify deployed price context
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-price-context-live.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public assets and capture isolated production transaction panel
        run: |
          set -euo pipefail
          mkdir -p test-results/live-price
          npm install --prefix /tmp/live-price playwright@1.56.1
          /tmp/live-price/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import {chromium} from '/tmp/live-price/node_modules/playwright/index.mjs';
          const base='https://tojihannun.designboard.net/';
          const proof={scope:'Deployed HTML/CSS/JS and real published JSON; transaction panel isolated from maps, ads and address search',assets:[],views:[],governmentRequests:0};
          for(const file of ['index.html','transaction-ui.js','transaction-ui.css','transaction-price-context.js']){
            const response=await fetch(base+file+'?proof=price-context-v4',{signal:AbortSignal.timeout(20000),headers:{'Cache-Control':'no-cache'}});
            assert.equal(response.status,200,file);
            const bytes=Buffer.from(await response.arrayBuffer());
            assert.equal(bytes.equals(fs.readFileSync(file)),true,'Deployed bytes differ: '+file);
            proof.assets.push({file,http:response.status,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});
          }
          const browser=await chromium.launch();
          try{
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:950},isMobile:width===390,hasTouch:width===390});
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              await page.route('**/*',async route=>{
                const url=route.request().url();
                if(/apis\.data\.go\.kr|api\.vworld\.kr/.test(url)){proof.governmentRequests++;return route.abort();}
                if(url===base){
                  const response=await route.fetch();let html=await response.text();
                  html=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'');
                  html=html.replace('</body>','<script src="./distributed-transactions.js?v=20261117.4"></script><script src="./static-transactions.js?v=20261117.4"></script><script src="./transaction-price-context.js?v=20261117.4"></script><script src="./transaction-ui.js?v=20261117.4"></script></body>');
                  return route.fulfill({response,body:html});
                }
                if(url.startsWith(base)||url.startsWith('https://softm.github.io/realestate-data-'))return route.continue();
                return route.abort();
              });
              await page.goto(base,{waitUntil:'domcontentloaded'});
              const result=await page.evaluate(async()=>{
                const now=new Date();const months=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-i,1);return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0');});
                const source=await window.TojiStaticTrades.lookup({lawdCode:'41194',emd:'옥길동',lot:'742-1'},'apartment',{months,includeNearby:false,force:true});
                if(!source||source.degraded||source.storageShard!=='realestate-data-014')throw Error('Owning distributed source unavailable');
                const items=source.rows.filter(row=>row.umdNm==='옥길동'&&row.jibun==='742-1').map(row=>({
                  date:row.dealYear+'-'+String(row.dealMonth).padStart(2,'0')+'-'+String(row.dealDay).padStart(2,'0'),month:row.dealYear+String(row.dealMonth).padStart(2,'0'),
                  amount:Number(String(row.dealAmount).replaceAll(',','')),area:Number(row.excluUseAr),unitPrice:Number(String(row.dealAmount).replaceAll(',',''))/Number(row.excluUseAr),
                  buildingName:row.buildingNm||row.mhouseNm,umdNm:row.umdNm,jibun:row.jibun,floor:row.floor,exact:true
                }));
                if(!items.length)throw Error('No actual target transactions');
                const panel=document.getElementById('detailPanelTransactions');panel.hidden=false;
                document.body.replaceChildren(panel);document.body.style.cssText='height:auto;min-height:100vh;overflow:auto;position:static;background:#f5f8f6;padding:12px;box-sizing:border-box;';
                panel.style.cssText='max-width:760px;width:100%;margin:0 auto;padding:12px;box-sizing:border-box;';
                const scope=document.createElement('div');scope.id='transactionScopeSwitch';panel.querySelector('.market-panel-head').after(scope);
                document.getElementById('transactionType').value='apartment';
                window.TojiTransactionUI.render({group:{scope:'옥길동 742-1',items,comparable:[],loading:false,error:'',degraded:false,coveredMonthKeys:source.completeMonths},definition:{label:'아파트',areaKind:'전용면적'},view:'parcel',type:'apartment',period:'saved',onView:()=>{},onReload:()=>{},onStop:()=>{}});
                return {source:source.source,shard:source.storageShard,records:items.length,months,context:document.getElementById('transactionPriceContext').textContent,stats:document.getElementById('transactionStats').innerText};
              });
              assert.equal(await page.locator('#transactionPriceMetric').inputValue(),'total');
              const count=await page.locator('#transactionStats').getAttribute('data-cohort-count');
              assert.ok(Number(count)>0);assert.equal(await page.locator('#transactionChartCard').getAttribute('data-cohort-count'),count);
              assert.match(await page.locator('#transactionChartTitle').textContent(),/매매금액/);
              assert.equal(await page.evaluate(()=>!!(document.getElementById('transactionStats').compareDocumentPosition(document.getElementById('transactionChartToggle'))&Node.DOCUMENT_POSITION_FOLLOWING)),true);
              await page.screenshot({path:'test-results/live-price/total-'+width+'.png',fullPage:true});
              await page.locator('#transactionPriceMetric').selectOption('sqm');
              assert.equal(await page.locator('#transactionStats').getAttribute('data-metric'),'sqm');
              assert.equal(await page.locator('#transactionChartCard').getAttribute('data-metric'),'sqm');
              assert.ok((await page.locator('.trade-row-top > strong').first().textContent()).includes('만원/㎡'));
              assert.equal(await page.locator('#transactionChartCard').getAttribute('data-cohort-count'),count);
              await page.screenshot({path:'test-results/live-price/unit-'+width+'.png',fullPage:true});
              assert.deepEqual(errors,[]);proof.views.push({width,...result,comparisonCount:Number(count),unitSwitch:'passed'});await page.close();
            }
            assert.equal(proof.governmentRequests,0);proof.status='passed';
          }finally{await browser.close();fs.writeFileSync('test-results/live-price/proof.json',JSON.stringify(proof,null,2));}
          console.log(JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-price-context-proof
          path: test-results/live-price/
          retention-days: 1
