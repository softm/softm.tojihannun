name: District layer checks
on:
  push:
    branches: [feat/district-boundaries-20261108]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: district-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Integrate narrowly scoped map hooks
        run: node scripts/install-districts.mjs --write
      - name: Regression tests
        run: |
          node --test scripts/*.test.mjs
          node --check districts.js
          node --check districts-core.js
          node --check app.js
          node --check server.mjs
      - name: Browser test dependencies (no lockfile changes)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression with synthetic fixtures
        run: node scripts/districts.browser.mjs
      - name: Build
        run: node scripts/build-pages.mjs
      - name: Save tested integration on feature branch
        if: github.ref == 'refs/heads/feat/district-boundaries-20261108'
        run: |
          git add index.html app.js server.mjs scripts/build-pages.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate tested district overlays into map and build'
            git push origin HEAD:feat/district-boundaries-20261108
          fi
      - name: Browser screenshots (fixture data, not official boundaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: district-browser-fixtures
          path: test-results/
          if-no-files-found: ignore
