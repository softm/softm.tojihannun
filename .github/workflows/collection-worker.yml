name: Regional collection operations
on:
  workflow_call:
    inputs:
      engine_ref:
        type: string
        required: true
      mode:
        type: string
        default: auto
    secrets:
      MOLIT_API_KEY:
        required: false
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: regional-transaction-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: softm/softm.tojihannun
          ref: ${{ inputs.engine_ref }}
          path: _engine
          persist-credentials: false
      - name: Publish live running state
        run: |
          set -euo pipefail
          python3 _engine/scripts/distribution/write_live_status.py --state running
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-status.json
          git commit -m 'ops: mark regional collector running'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/checkout@v4
        with:
          repository: softm/softm.tojihannun
          ref: main
          path: _control
          persist-credentials: false
          sparse-checkout: data/transactions
      - name: Resolve final checkpoint
        id: plan
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}',os.environ['ENGINE_REF'])
          config=json.loads(Path('_control/data/transactions/storage-registry.json').read_text())
          shard=next(s for s in config['shards'] if s['repository']==os.environ['GITHUB_REPOSITORY'])
          source=shard.get('handoverCommit') or config['bootstrapSourceRef']
          source_repo=shard.get('handoverSourceRepository','softm/softm.tojihannun')
          assert re.fullmatch('[0-9a-f]{40}',source)
          assert re.fullmatch(r'softm/(?:softm\.tojihannun|realestate-data-\d{3})',source_repo)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source_ref='+source+'\n')
              out.write('source_repo='+source_repo+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.plan.outputs.source_repo }}
          ref: ${{ steps.plan.outputs.source_ref }}
          path: _legacy
          persist-credentials: false
          sparse-checkout: data/transactions
      - name: Collect and validate owned regions
        id: worker
        continue-on-error: true
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.source_ref }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          python3 _engine/scripts/distribution/operations.py --root . --control _control --legacy _legacy --shard "${GITHUB_REPOSITORY#*/}" --source-commit "$SOURCE_COMMIT" --mode "$INPUT_MODE" | tee test-results/worker.jsonl
      - name: Persist checkpoints and failure state without force pushing
        if: always() && steps.worker.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in .gitignore data/transactions migration-receipt.json shard-status.json split-plan.json collection-result.json; do
            if test -e "$file"; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect regional transactions with persistent retry and request accounting'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check optional Pages publication
        id: pages
        if: steps.worker.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          ready=False
          try:
              with urllib.request.urlopen(req,timeout=20) as response:ready=json.load(response).get('build_type')=='workflow'
          except urllib.error.HTTPError as error:
              if error.code not in (403,404):raise
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready='+str(ready).lower()+'\n')
          if not ready:print('::notice::Collection committed successfully; Pages setup is a separate publishing step.')
          PY
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-run-proof
          path: |
            test-results/
            collection-result.json
            shard-status.json
            migration-receipt.json
            split-plan.json
          retention-days: 1
      - name: Publish live final state
        if: always()
        env:
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: |
          set -euo pipefail
          python3 _engine/scripts/distribution/write_live_status.py --state final --worker-outcome "$WORKER_OUTCOME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: mark regional collector finished'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Continue immediately while this shard still has request budget
        if: steps.worker.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          result=json.loads(Path('collection-result.json').read_text())
          state=json.loads(Path('data/transactions/collection-state.json').read_text())
          config=json.loads(Path('_control/data/transactions/storage-registry.json').read_text())
          shard_id=os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          q=config['requestBudget']
          daily=int(q.get('perShardDaily',{}).get(shard_id,0))
          cutoff=datetime.now(timezone.utc)-timedelta(hours=24)
          migration=state.get('migration') or {}
          try:
              if migration.get('phase')=='handover' and migration.get('verifiedAt'):
                  handover=datetime.fromisoformat(migration['verifiedAt'].replace('Z','+00:00'))
                  if handover>cutoff:
                      cutoff=handover
          except (ValueError,TypeError):
              raise SystemExit('invalid migration verifiedAt')
          used=0
          for item in state.get('requestLedger',[]):
              try:
                  if datetime.fromisoformat(item['at'])>cutoff:
                      used+=int(item.get('requests',0))
              except (ValueError,KeyError,TypeError):
                  raise SystemExit('invalid request ledger')
          remaining=max(0,daily-used)
          run=result.get('run',{})
          summary=result.get('summary',{})
          backlog=int(summary.get('completedTasks',0)) < int(summary.get('expectedTasks',0))
          healthy=run.get('status') in ('success','partial') and int(run.get('success',0))>0
          cooldown=summary.get('apiCooldownUntil')
          should_continue=remaining>0 and backlog and healthy and not cooldown
          print(json.dumps({'used24h':used,'dailyAllocation':daily,'remaining':remaining,
                            'backlog':backlog,'healthy':healthy,'continue':should_continue},
                           ensure_ascii=False))
          if not should_continue:
              raise SystemExit(0)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/collect.yml/dispatches'
          body=json.dumps({'ref':'main','inputs':{'mode':'auto'}}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'Content-Type':'application/json',
              'User-Agent':'tojihannun-continuous-collector'})
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status not in (201,204):
                  raise SystemExit('workflow dispatch failed: '+str(response.status))
          print('::notice::Dispatched the next collection batch immediately; shard budget remains.')
          PY
      - name: Mark source failures accurately
        if: steps.worker.outcome == 'failure'
        run: exit 1
  deploy:
    if: needs.collect.outputs.pages_ready == 'true'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
